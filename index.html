<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Grimório de Guilherme</title>
<meta name="description" content="Portfolio de Guilherme: obras, jogos, folguedos e relíquias, guardados num grimório à luz de vela.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin>

<link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div id="intro">
  <p class="incipit" id="intro-pre"></p>
  <h1 id="intro-name">Guilherme</h1>
  <button id="ignite" type="button" disabled>
    <svg viewBox="0 0 44 96" aria-hidden="true">
      <g class="fire"><path d="M22 4c5 7 8 11 8 16a8 8 0 0 1-16 0c0-5 3-9 8-16z"/><path d="M22 13c2.4 3.4 3.6 5.4 3.6 7.6a3.6 3.6 0 0 1-7.2 0c0-2.2 1.2-4.2 3.6-7.6z"/></g>

      <path class="wax" d="M12 32c4-2 16-2 20 0v62H12z"/>
      <path class="wax-shade" d="M26 33c2 .2 4 .5 6 1v60h-6z"/>
      <path class="wax" d="M15 33c0 6-1 9-1 12 0 2 2 2 2 0 0-3 1-6 1-12z"/>
    </svg>
    <span id="ignite-label"></span>
  </button>
</div>

<div id="topbar" class="hud">
  <div id="lang" role="group">
    <button type="button" data-lang="pt" lang="pt-BR"><span class="long">Português</span><span class="short">PT</span></button>
    <button type="button" data-lang="en" lang="en"><span class="long">English</span><span class="short">EN</span></button>
    <button type="button" data-lang="es" lang="es"><span class="long">Español</span><span class="short">ES</span></button>
  </div>
  <button id="sound" class="off" type="button" aria-pressed="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 44a15 13 0 1 0 30 0a15 13 0 1 0-30 0"/><path d="M20 44a4 4 0 1 0 8 0a4 4 0 1 0-8 0"/><path d="M33 34 54 10M50 8l7 7M52 6l3 3M55 9l3 3"/><path class="mute" d="M8 58 58 6" stroke="#c4473b" stroke-width="3"/></svg>
    <span id="sound-label"></span>
  </button>
</div>

<nav id="nav"><ol id="ribbons" class="hud off"></ol></nav>
<p id="hint" class="hud off" aria-live="polite"></p>
<div id="pager" class="hud off">
  <button id="prev" type="button"><svg viewBox="0 0 120 60" aria-hidden="true"><use href="#manicule"/></svg></button>
  <span id="where" aria-live="polite"></span>
  <button id="next" type="button"><svg viewBox="0 0 120 60" aria-hidden="true"><use href="#manicule"/></svg></button>
</div>

<div id="tip" class="off" aria-hidden="true"><div class="pg"><b></b><span></span></div></div>

  <g fill="currentColor" stroke="#2b1a10" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M4 15h18v33H4z"/>
    <path d="M22 17c10-5 22-6 32-2l52 4c6 .5 8 4 8 6.5s-2.5 6-8 6H66c3 2 3.5 7-1.5 8.5 3 2.5 2 7.5-2.5 8 2.5 3 1 7-3.5 7.2H40c-8 0-14-2.5-18-5z"/>
  </g>
  <g fill="none" stroke="#2b1a10" stroke-width="1.4" stroke-linecap="round">
    <path d="M9 15v33M14 15v33M18.5 15v33"/>
    <path d="M40 31c6-1 13 0 18 3M100 21.5c2 .3 3 2 3 4M64 40.5c-5 0-9-1-12-2M62 48.3c-5 0-9-1-12-2"/>

</symbol></svg>

<article id="a11y" class="sr-only"></article>

<script type="module" src="src/main.js"></script>

</html>
